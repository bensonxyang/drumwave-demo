<html>

<head>
    <title>Benson Yang's Assignment</title>
    <meta charset="utf-8" />
</head>

<style>
    div {
        margin: 10px;
    }

    label {
        display: inline-block;
        width: 200px;
    }
</style>

<body>
    <form id="form">
        <div>
            <label for="id">id</label>
            <input id="id" name="id" />
        </div>
        <div>
            <label for="name">name</label>
            <input id="name" name="name" />
        </div>
        <div>
            <label for="price">price</label>
            <input id="price" name="price" />
        </div>
        <div>
            <label for="tags">tags (comma-separated)</label>
            <input id="tags" name="tags" placeholder="tag1, tag2, tag3" />
        </div>
        <div>
            <button type="submit">Validate</button>
        </div>
        <div>
            <div id="msg"></div>
            <pre id="out" hidden></pre>
        </div>
    </form>
      <script>
        const $ = (id) => document.getElementById(id);
        const form = $("form"), msg = $("msg"), out = $("out");

        const isNonEmptyString = (v) => typeof v === "string" && v.trim().length > 0;
        const toNumber = (v) => (v.trim() === "" ? NaN : Number(v));
        const parseTags = (v) => v.split(",").map(s => s.trim()).filter(Boolean);

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            msg.className = "";
            msg.innerHTML = "";
            out.hidden = true;

            const data = {
                id: $("id").value,
                name: $("name").value,
                price: $("price").value,
                tags: parseTags($("tags").value),
            };

            const errors = [];
            if (!isNonEmptyString(data.id)) errors.push("Please enter an id.");
            if (!isNonEmptyString(data.name)) errors.push("Please enter a name.");

            const n = toNumber(data.price);
            if (!Number.isFinite(n)) errors.push("Price must be a number.");
            if (data.tags.length === 0) errors.push("Tags must contain at least one value.");

            if (errors.length) {
                msg.className = "err";
                msg.innerHTML = errors.map(x => `<div>${x}</div>`).join("");
                return;
            }

            const payload = {
                id: data.id.trim(),
                name: data.name.trim(),
                price: n,
                tags: data.tags
            };

            try {
                msg.textContent = "Sending...";

                const res = await fetch("http://localhost:3000/items", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                });

                const result = await res.json();
                if (!res.ok) throw new Error(result.error || "Request failed");

                msg.className = "ok";
                msg.textContent = "Saved";
                out.hidden = false;
                out.textContent = JSON.stringify(result, null, 2);

            } catch (err) {
                msg.className = "err";
                msg.textContent = err.message || "API request failed.";
            }
        });
    </script>
</body>
</html>
